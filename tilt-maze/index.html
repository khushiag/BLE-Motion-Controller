<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilt Maze</title>
    <style>
      :root { --accent: #4f7cff; --pink: #ff4fd8; --text: #e6e9f2; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
      canvas { display: block; }

      .hud { position: fixed; top: 16px; padding: 14px 16px; border-radius: 14px;
        background: rgba(12, 16, 28, 0.72); backdrop-filter: blur(8px);
        border: 1px solid rgba(91, 124, 255, 0.25); font-variant-numeric: tabular-nums; }
      .hud.left { left: 16px; min-width: 210px; }
      .hud.right { right: 16px; text-align: right; max-width: 300px; }
      .hud h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.6; }
      .row { display: flex; justify-content: space-between; gap: 18px; margin: 4px 0; font-size: 15px; }
      .row span:first-child { opacity: 0.6; }
      #time { font-size: 22px; font-weight: 600; }

      button { font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 9px; border: none;
        background: var(--accent); color: #fff; cursor: pointer; margin-left: 6px; }
      button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.25); }
      button:hover { filter: brightness(1.15); }
      #status { margin-top: 10px; font-size: 13px; opacity: 0.8; }
      #rate { font-size: 12px; opacity: 0.5; margin-top: 2px; }

      .help { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-size: 12px; opacity: 0.45; white-space: nowrap; }
      #debug { position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
        font: 12px ui-monospace, Consolas, monospace; opacity: 0.5; white-space: nowrap; }

      #overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        opacity: 0; transition: opacity 300ms; }
      #overlay.show { opacity: 1; }
      #overlay .card { text-align: center; padding: 28px 40px; border-radius: 18px;
        background: rgba(12, 16, 28, 0.8); border: 1px solid rgba(255, 79, 216, 0.4);
        box-shadow: 0 0 60px rgba(255, 79, 216, 0.25); }
      #overlayTitle { font-size: 34px; font-weight: 700; margin: 0 0 6px; }
      #overlaySub { opacity: 0.75; }

      @media (max-width: 700px) {
        .hud.left { min-width: 0; } .help, #debug { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="hud left">
      <h1>Tilt Maze</h1>
      <div class="row"><span>Level</span><span id="level">–</span></div>
      <div class="row"><span>Time</span><span id="time">0.0s</span></div>
      <div class="row"><span>Best</span><span id="best">—</span></div>
      <div class="row"><span>Falls</span><span id="falls">0</span></div>
    </div>

    <div class="hud right">
      <button id="calibBtn" class="ghost">Calibrate</button>
      <button id="connectBtn">Connect board</button>
      <div id="status">Not connected</div>
      <div id="rate">keyboard mode</div>
    </div>

    <div id="overlay"><div class="card"><div id="overlayTitle"></div><div id="overlaySub"></div></div></div>

    <div id="debug"></div>
    <div class="help">Tilt the board (or arrow keys / WASD) · C calibrate · R restart · N skip level · L latency test</div>

    <script type="module" src="/src/game.js"></script>
  </body>
</html>
